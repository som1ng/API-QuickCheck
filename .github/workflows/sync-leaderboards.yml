name: Sync Leaderboards Snapshot

on:
  schedule:
    # Runs at 01:00 UTC every 3 days (staggered 1h after model-baseline sync)
    - cron: '0 1 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-leaderboards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firecrawl CLI
        run: npm install -g firecrawl-cli@latest

      - name: Scrape leaderboards (JS-rendered pages)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          mkdir -p .firecrawl
          firecrawl scrape "https://artificialanalysis.ai/leaderboards/models" -o .firecrawl/aa-models.md
          firecrawl scrape "https://arena.ai/leaderboard/agent" -o .firecrawl/arena-agent.md

      - name: Parse and validate snapshots
        run: npm run sync:leaderboards

      - name: Commit and Push Changes if Snapshot Updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/leaderboards/
          if git diff --staged --quiet; then
            echo "No leaderboard changes detected."
          else
            git commit -m "chore(leaderboard): auto-sync AA + Arena snapshots [skip ci]"
            git push
          fi
