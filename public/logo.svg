    <path d="M-30 -30 L-18 -22 L-16 -16 L-22 -18 Z" fill="#d98266" opacity="0.85" />
    <path d="M30 -30 L18 -22 L16 -16 L22 -18 Z" fill="#d98266" opacity="0.85" />
    <path d="M-30 30 L-18 22 L-16 16 L-22 18 Z" fill="#d98266" opacity="0.85" />
    <path d="M30 30 L18 22 L16 16 L22 18 Z" fill="#d98266" opacity="0.85" />
    
    <!-- Central Shield & Verification Checkmark -->
    <circle r="18" fill="#141413" stroke="#cc785c" stroke-width="2.5" />
    <path d="M-7 0 L-2 5 L7 -4" stroke="#5db872" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
