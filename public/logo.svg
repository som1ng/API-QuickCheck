<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="28" fill="#1b1a18" />
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="#2e2b27" stroke-width="2" />
  
  <!-- Outer Radial Petals (Anthropic Starburst Theme) -->
  <g transform="translate(60, 60)">
    <!-- Central Glow Ring -->
    <circle r="36" fill="#cc785c" fill-opacity="0.12" />
    <circle r="26" stroke="#cc785c" stroke-width="2" stroke-dasharray="3 3" opacity="0.4" />
    
    <!-- 8 Symmetrical Spikes -->
    <path d="M0 -42 L4 -26 L0 -22 L-4 -26 Z" fill="#cc785c" />
